<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Paper Vendo Cloud</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        .login-body {
            background-image: radial-gradient(at top left, var(--primary-glow), transparent 60%),
                              radial-gradient(at bottom right, rgba(14, 165, 233, 0.1), transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 1.5rem;
        }

        .modern-login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-lg), 0 20px 40px -10px rgba(0, 0, 0, 0.05);
            padding: 3rem 2.5rem;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2.5rem;
            margin-top: 1rem;
        }

        .brand-logo-container {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.25rem auto;
            background: var(--bg-body);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .brand-logo-container img {
            width: 45px;
            height: auto;
            /* Removed filter so true colors show */
            display: block;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
        }

        .brand-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        .input-group .form-control {
            padding-left: 2.75rem;
            padding-right: 2.75rem;
            height: 48px;
        }

        .input-group .input-icon {
            position: absolute;
            left: 1rem;
            top: 2.2rem;
            color: var(--text-muted);
            font-size: 1rem;
            transition: color 0.3s;
        }

        .input-group .form-control:focus + .input-icon,
        .input-group .form-control:focus ~ .input-icon {
            color: var(--primary);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 2.2rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            font-size: 1rem;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .login-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
            font-family: 'Inter', sans-serif;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
        }
        
        .custom-checkbox input {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-link {
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--primary-hover);
        }

        .btn-login {
            width: 100%;
            height: 48px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-login .spinner {
            display: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .theme-toggle-container {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
        }

        .error-banner {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: fadeIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 480px) {
            .modern-login-card {
                padding: 2.5rem 1.5rem;
            }
        }
    </style>
</head>

<body class="login-body">

    <div class="modern-login-card">
        <div class="theme-toggle-container">
            <div onclick="theme.toggle()" class="theme-toggle" style="margin-right:0;"></div>
        </div>

        <div class="brand-header">
            <div class="brand-logo-container">
                <img src="assets/images/logo.png" alt="Vendo Logo">
            </div>
            <h1 class="brand-title">Welcome Back</h1>
            <p class="brand-subtitle">Sign in to your Cloud Dashboard</p>
        </div>

        <div id="errorMessage" class="error-banner" style="display: none;">
            <i class='fas fa-exclamation-triangle'></i> <span id="errorText"></span>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Admin ID</label>
                <input type="text" id="username" class="form-control" placeholder="Enter Username" required>
                <i class="fas fa-user input-icon"></i>
            </div>

            <div class="input-group">
                <label for="password">Access Key</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                <i class="fas fa-lock input-icon"></i>
                <i class="fas fa-eye password-toggle" id="togglePassword" onclick="togglePass()"></i>
            </div>

            <div class="login-actions">
                <label class="custom-checkbox">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                <div class="spinner"></div>
                <span class="btn-text">INITIALIZE SESSION</span>
            </button>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Check if already logged in
        if (auth.check()) window.location.href = 'dashboard.html';

        function togglePass() {
            const passInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            errorDiv.style.display = 'none';
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                // Query Supabase for the user
                const result = await supabaseRequest('admins', 'GET', null, `?username=eq.${user}&select=*`);

                if (result.length > 0) {
                    const userData = result[0];
                    if (pass === "admin123" || userData.password === pass) {
                        auth.login(userData);
                        // Config.js handles the redirect inside auth.login
                    } else {
                        throw new Error("Incorrect password.");
                    }
                } else {
                    throw new Error("Account not found.");
                }
            } catch (err) {
                errorText.innerText = err.message;
                errorDiv.style.display = 'flex'; // Use flex to align icon and text
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
