<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Status - Paper Vendo</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .status-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .status-pill .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        .pulse-dot.offline {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
            animation: none;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>

<body>
    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('show'); this.classList.remove('show');"></div>

    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-microchip"></i> VENDO CLOUD
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                <li><a href="inventory.html"><i class="fas fa-sliders-h"></i> Inventory</a></li>
                <li><a href="transactions.html"><i class="fas fa-history"></i> History</a></li>
                <li><a href="users.html"><i class="fas fa-user-friends"></i> Admins</a></li>
                <li><a href="machine.html" class="active"><i class="fas fa-satellite-dish"></i> Machine Status</a></li>
                <li><a href="#" onclick="auth.logout()"><i class="fas fa-power-off"></i> Logout</a></li>
            </ul>
        </div>

        <div id="content">
            <!-- Header -->
            <div class="topbar">
                <div style="display:flex; align-items:center;">
                    <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('show'); document.querySelector('.sidebar-overlay').classList.toggle('show');">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 id="pageTitle">Hardware Telemetry</h2>
                </div>
                <div style="display:flex; align-items:center;">
                    <div class="theme-toggle" onclick="theme.toggle()"></div>
                    <div class="user-profile">
                        <div class="user-info">
                            <span class="user-name" id="displayUsername">Admin</span>
                            <span class="user-role" id="displayRole">Super Admin</span>
                        </div>
                        <div class="user-avatar" id="displayInitial">A</div>
                    </div>
                </div>
            </div>

            <div class="container-fluid">
                <div class="card mb-4">
                    <div class="card-header">
                        <h6>Live ESP32 Data</h6>
                    </div>
                    <div class="card-body">
                        <div class="status-grid">
                            <div class="status-pill">
                                <div>
                                    <p class="text-xs mb-1">Connection State</p>
                                    <h5 class="mb-0" id="m_status">Connecting...</h5>
                                </div>
                                <div class="icon-box" id="m_pulse_box">
                                    <span class="pulse-dot" id="m_pulse"></span>
                                </div>
                            </div>
                            <div class="status-pill">
                                <div>
                                    <p class="text-xs mb-1">Wi-Fi Signal Strength</p>
                                    <h5 class="mb-0" id="m_wifi">--</h5>
                                </div>
                                <div class="icon-box text-info">
                                    <i class="fas fa-wifi"></i>
                                </div>
                            </div>
                            <div class="status-pill">
                                <div>
                                    <p class="text-xs mb-1">Hardware Error Codes</p>
                                    <h5 class="mb-0 text-danger" id="m_errors">None</h5>
                                </div>
                                <div class="icon-box text-danger">
                                    <i class="fas fa-exclamation-triangle"></i>
                                </div>
                            </div>
                            <div class="status-pill">
                                <div>
                                    <p class="text-xs mb-1">Last Heartbeat Ping</p>
                                    <h5 class="mb-0" id="m_heartbeat">--</h5>
                                </div>
                                <div class="icon-box text-primary">
                                    <i class="fas fa-clock"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const user = auth.check();
        if (user) {
            document.getElementById('displayUsername').innerText = user.username;
            let cleanRole = user.role.replace('_', ' ').replace(/\\b\\w/g, l => l.toUpperCase());
            document.getElementById('displayRole').innerText = cleanRole;
            document.getElementById('displayInitial').innerText = user.username.charAt(0).toUpperCase();
        }

        async function fetchMachineData() {
            const status = await supabaseRequest('machine_status', 'GET');
            
            // Map the rows to a dictionary
            const data = {};
            status.forEach(row => { data[row.status_key] = row.status_value; });

            // Evaluate Heartbeat
            if (data['last_heartbeat']) {
                const lastHeart = new Date(data['last_heartbeat']);
                const secondsAgo = Math.floor((new Date() - lastHeart) / 1000);
                const isOnline = secondsAgo < 120; // 2 minutes timeout
                
                document.getElementById('m_status').innerText = isOnline ? "Online (Active)" : "Offline (Disconnected)";
                document.getElementById('m_status').className = isOnline ? "text-success mb-0 font-weight-bold" : "text-danger mb-0 font-weight-bold";
                
                const pulse = document.getElementById('m_pulse');
                if (isOnline) {
                    pulse.classList.remove('offline');
                } else {
                    pulse.classList.add('offline');
                }
                
                document.getElementById('m_heartbeat').innerText = isOnline ? "Just now" : `${Math.floor(secondsAgo / 60)} mins ago`;
            }

            document.getElementById('m_wifi').innerText = data['wifi_signal'] || "Unknown";
            document.getElementById('m_errors').innerText = data['current_error'] || "None";
            
            if (data['current_error'] && data['current_error'] !== "None") {
                document.getElementById('m_errors').className = "text-danger mb-0 font-weight-bold";
            } else {
                document.getElementById('m_errors').className = "text-success mb-0 font-weight-bold";
            }
        }

        fetchMachineData();
        setInterval(fetchMachineData, 10000); // 10 second rapid refresh for telemetry
    </script>
</body>
</html>
